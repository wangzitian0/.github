name: "Idea — proposal"
description: "A proposal that waits for a decision. Not committed work."
title: "idea(<area>): <proposal>"
labels: ["idea"]
body:
  - type: markdown
    attributes:
      value: |
        A **low-bar** place for a proposal. The aim is a decision: make it a **Task**, or drop it.
        State the cost as plainly as the value.
  - type: textarea
    id: idea
    attributes:
      label: "The idea, in one or two lines"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: "What problem did you meet, and where?"
      description: "One real occurrence: the link, the command or the output. Not a general statement."
      placeholder: |
        Occurrence: <link / command / output>
        Cost each time: ...
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: "How do you handle it today?"
      description: "The present workaround, and the existing mechanism that this idea overlaps or replaces."
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: "Rough approach"
      description: "A sketch, not a design."
    validations:
      required: false
  - type: textarea
    id: roi
    attributes:
      label: "Value and cost"
      placeholder: |
        Value: ...
        Cost and risk: ...
    validations:
      required: false
  - type: textarea
    id: decision
    attributes:
      label: "What decides it?"
      description: "The measurement or fact that makes this a Task, and the one that drops it."
      placeholder: |
        Do it if: ...
        Drop it if: ...
    validations:
      required: true
  - type: checkboxes
    id: hygiene
    attributes:
      label: "No secret, no private data"
      options:
        - label: "The body holds no token or password, and no real amount, balance, account number, personal name or local path."
          required: true
