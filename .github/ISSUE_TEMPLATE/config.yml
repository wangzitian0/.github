# Account defaults: every repository without its own .github/ISSUE_TEMPLATE
# inherits these four issue types.
#   Issue    - a defect: something behaves differently from a stated rule
#   Task     - committed, scoped work with checks that prove it
#   Idea     - a proposal that waits for a decision
#   Incident - a failure that happened in a running environment
#
# Body contract. GitHub renders each field as "### <label>". An issue that is
# created from the command line (gh issue create --body-file) uses the same
# headings, in the same order, and fills each required field.
# Each field asks for pasted evidence: a command, its verbatim output, a
# commit SHA or a link. Write "Not measured" when you did not measure.
blank_issues_enabled: false
